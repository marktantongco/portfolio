<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Mark Anthony Tantongco | AI Creative Technologist</title>
    <meta name="description" content="Building at the intersection of bleeding-edge AI, neo-brutalist design, and strategic brand systems." />
    <meta name="author" content="Mark Anthony Tantongco" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Preload: favicon is render-blocking for browser tab -->
    <link rel="icon" href="/portfolio/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/portfolio/apple-touch-icon.png" />

    <!-- Preconnect: nothing to preconnect — system fonts, no third-party -->

    <!-- Open Graph -->
    <meta property="og:title" content="Mark Anthony Tantongco | AI Creative Technologist" />
    <meta property="og:description" content="Building at the intersection of bleeding-edge AI, neo-brutalist design, and strategic brand systems." />
    <meta property="og:url" content="https://marktantongco.github.io/portfolio" />
    <meta property="og:image" content="/portfolio/og-image.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@markytanky" />
    <meta name="twitter:title" content="Mark Anthony Tantongco | AI Creative Technologist" />
    <meta name="twitter:description" content="Building at the intersection of bleeding-edge AI, neo-brutalist design, and strategic brand systems." />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/portfolio/manifest.json" />

    <!-- GEO: RSS feed signals content production to AI crawlers -->
    <link rel="alternate" type="application/rss+xml" title="Mark Anthony Tantongco — Thoughts" href="/portfolio/blog/feed.xml" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Mark Anthony Tantongco",
      "jobTitle": "AI Creative Technologist",
      "url": "https://markanthony.dev",
      "sameAs": [
        "https://github.com/marktantongco",
        "https://linkedin.com/in/markanthongco",
        "https://twitter.com/markytanky",
        "https://instagram.com/markytanky"
      ],
      "knowsAbout": [
        "Prompt Engineering", "WebGPU", "React", "TypeScript",
        "AI Image Generation", "Brand Systems", "GEO Optimization",
        "Three.js", "Framer Motion", "Neo-Brutalist Design"
      ],
      "workLocation": { "@type": "Place", "name": "San Francisco, CA" }
    }
    </script>

    <!-- Critical inline CSS: prevents FOUC on load.
         Sets background to --brutal-void immediately so
         the page never flashes white. -->
    <style>
      html{background:#0a0a0a}body{margin:0;background:#0a0a0a;color:#fff}
    </style>

    <!-- Skip link — first focusable element, z-200 above everything -->
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[200] focus:px-4 focus:py-2 focus:font-bold" style="background:var(--brutal-yellow);color:var(--brutal-void);text-decoration:none;border:4px solid var(--brutal-border)">skip to content</a>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
